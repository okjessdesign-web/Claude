<style>
  /* Phones + tablets: "Menu" opens a full-screen menu page with big, easy-to-tap links */
  @media (max-width: 1024px) { #navlinks { display: none !important; } }
  /* the page never slides sideways on phones (the big edge-to-edge type pokes a few px past the screen) */
  html, body { overflow-x: clip; }
  @supports not (overflow: clip) { body { overflow-x: hidden; } }
  .mm { position: fixed; inset: 0; z-index: 8000; background: var(--bg); display: flex; flex-direction: column; padding: 16px var(--pad) 28px;
        visibility: hidden; clip-path: inset(0 0 100% 0); transition: clip-path .7s cubic-bezier(.76, 0, .24, 1), visibility 0s .7s; }
  .mm.open { visibility: visible; clip-path: inset(0 0 0 0); transition: clip-path .7s cubic-bezier(.76, 0, .24, 1); }
  .mm-top { display: flex; justify-content: space-between; align-items: center; min-height: 42px; }
  .mm-top { position: relative; }
  .mm-top .logo { position: absolute; width: 42px; height: 42px; }   /* placed by script exactly over the header logo, so it never changes size */
  .mm-x { position: absolute; right: 0; }
  .mm-x { border: 0; background: none; padding: 8px; margin: -8px; color: var(--fg); cursor: pointer; }
  .mm-x svg { display: block; width: 20px; height: 20px; }
  .mm-list { margin-top: auto; border-top: var(--hair); }
  .mm-list a { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 14px 0 12px; border-bottom: var(--hair); overflow: hidden; color: var(--fg); }
  .mm-list .w { display: block; font-family: var(--display); font-weight: 700; letter-spacing: -0.05em; line-height: .95; font-size: clamp(38px, 10.6vw, 96px); white-space: nowrap;
                transform: translateY(110%); transition: transform .9s cubic-bezier(.16, 1, .3, 1); transition-delay: calc(var(--i) * 70ms + 250ms); }
  .mm.open .mm-list .w { transform: none; }
  .mm-list .n { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .02em; padding-bottom: .5em; opacity: 0; transition: opacity .4s ease; transition-delay: calc(var(--i) * 70ms + 500ms); }
  .mm.open .mm-list .n { opacity: 1; }
  .mm-list a:active .w { opacity: .6; }
  .mm-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; margin-top: 26px; font-family: var(--label); font-weight: 500; font-size: 14px; text-transform: uppercase; color: var(--fg); }
  .mm-foot a { color: var(--fg); }
  html.mm-on, html.mm-on body { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .mm, .mm.open, .mm-list .w { transition: none; } }
</style>
<script>
(function () {
  var nav = document.getElementById('nav'), btn = nav && nav.querySelector('.nbtn'), links = document.getElementById('navlinks');
  if (!btn || !links) return;
  var small = window.matchMedia('(max-width: 1024px)');
  var mm = document.createElement('div'); mm.className = 'mm'; mm.setAttribute('role', 'dialog'); mm.setAttribute('aria-modal', 'true'); mm.setAttribute('aria-label', 'Menu'); mm.setAttribute('aria-hidden', 'true');
  var logo = document.querySelector('header .logo');
  var top = '<div class="mm-top">' + (logo ? '<a class="logo" href="index.html" aria-label="Home"></a>' : '<span></span>') +
            '<button class="mm-x" type="button" aria-label="Close menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M3.5 3.5l13 13M16.5 3.5l-13 13"/></svg></button></div>';
  var list = [].map.call(links.querySelectorAll('a'), function (a, i) {
    return '<a href="' + a.getAttribute('href') + '" style="--i:' + i + '"><span class="w">' + a.textContent + '</span><span class="n">0' + (i + 1) + '</span></a>';
  }).join('');
  mm.innerHTML = top + '<nav class="mm-list">' + list + '</nav>' +
    '<div class="mm-foot"><a href="mailto:hello@okjess.com">hello@okjess.com</a><a href="https://www.instagram.com/okjessdesign/" target="_blank" rel="noopener">Instagram</a></div>';
  document.body.appendChild(mm);
  function place() {                                    // line the menu's logo and x up with the header's logo and Menu button
    var hl = logo && logo.getBoundingClientRect(), hb = btn.getBoundingClientRect(), mt = mm.querySelector('.mm-top');
    var base = mt.getBoundingClientRect(), ml = mm.querySelector('.mm-top .logo'), mx = mm.querySelector('.mm-x');
    if (hl && ml) { ml.style.left = (hl.left - base.left) + 'px'; ml.style.top = (hl.top - base.top) + 'px'; ml.style.width = hl.width + 'px'; ml.style.height = hl.height + 'px'; }
    if (mx) { var xr = mx.getBoundingClientRect(); mx.style.top = (hb.top + hb.height / 2 - base.top - xr.height / 2 - parseFloat(getComputedStyle(mx).marginTop)) + 'px'; }
  }
  function setOpen(open) {
    if (open) place();
    mm.classList.toggle('open', open); mm.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.documentElement.classList.toggle('mm-on', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) setTimeout(function () { var x = mm.querySelector('.mm-x'); if (x) x.focus(); }, 50); else btn.focus();
  }
  btn.addEventListener('click', function (e) {             // on phones/tablets "Menu" opens this page instead of the row of links
    if (!small.matches) return;
    e.stopImmediatePropagation(); e.preventDefault(); setOpen(true);
  }, true);
  mm.querySelector('.mm-x').addEventListener('click', function () { setOpen(false); });
  mm.addEventListener('click', function (e) { var a = e.target.closest('.mm-list a'); if (a && a.getAttribute('href').charAt(0) === '#') setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && mm.classList.contains('open')) setOpen(false); });
  small.addEventListener && small.addEventListener('change', function () { if (!small.matches) setOpen(false); });
})();
</script>
