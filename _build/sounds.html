<script>
// Soft console-style UI sounds, drawn live with the Web Audio API (no sound files):
// a tiny tick when the pointer lands on a link or button, and a bubbly two-note pop when you click one.
// Volume is kept low. Browsers only allow sound after the first click or tap, so the first hover may be silent.
(function () {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ctx = null, last = null, lastTick = 0;
  var SEL = 'a, button, .nbtn, .pill, label, input, textarea, .ft';   // things you can pick (Agency tiles too)
  function audio() {
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, endFreq, start, dur, vol, type) {
    var c = audio(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);           // quick, soft attack
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);          // gentle fade
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function tick() {                                                  // hover: a tiny glassy tick
    var now = performance.now();
    if (now - lastTick < 60 || !ctx || ctx.state !== 'running') return;
    lastTick = now;
    tone(2100, 1900, 0, 0.035, 0.018, 'sine');
  }
  function pop() {                                                   // click: a rounded two-note pop, rising
    tone(660, 880, 0, 0.09, 0.07, 'sine');
    tone(990, 1320, 0.055, 0.12, 0.05, 'sine');
  }
  function nope() {                                                  // a click on nothing: a playful little "boo-dip", two soft notes stepping down
    var first = !ctx; audio(); if (first) return;                   // the very first click only switches sound on
    tone(784, 760, 0, 0.075, 0.03, 'triangle');
    tone(587, 523, 0.06, 0.11, 0.028, 'triangle');
  }
  function okay() {                                                  // click the name (Okjess / Jessica Baker): a cute two-syllable "oh-kay" in tones
    tone(466, 440, 0, 0.13, 0.05, 'triangle'); tone(932, 880, 0, 0.1, 0.012, 'sine');        // "oh": soft and a little low
    tone(2400, 1800, 0.15, 0.015, 0.02, 'square');                                            // the tiny "k"
    tone(659, 784, 0.16, 0.2, 0.055, 'triangle'); tone(1318, 1568, 0.16, 0.14, 0.012, 'sine'); // "kay": brighter, rising
  }
  function isName(t) {
    var w = t.closest && t.closest('.wmbox'); if (w && w.textContent.replace(/\s/g, '') === 'Okjess') return true;
    var s = t.closest && t.closest('span, small'); return !!(s && /Jessica Baker/.test(s.textContent) && s.textContent.length < 40);
  }
  function sparkle() {                                             // the cursor turns into the spinning logo: a little twinkly rising run
    if (!ctx || ctx.state !== 'running') return;
    [1047, 1319, 1568, 2093].forEach(function (f, i) { tone(f, f * 1.01, i * 0.055, 0.16, 0.045, 'triangle'); });
    tone(3136, 2960, 0.24, 0.3, 0.02, 'sine');                       // tiny shimmer at the end
  }
  document.addEventListener('okjess:spin', sparkle);
  document.addEventListener('pointerover', function (e) {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    var el = e.target.closest && e.target.closest(SEL);
    if (el && el !== last) tick();
    last = el;
  });
  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest && e.target.closest(SEL);
    if (el) pop(); else if (isName(e.target)) { audio(); okay(); } else nope();                                      // empty space gets a soft muted tock (the first click also unlocks sound)
  }, true);
  // Let the pop finish before leaving for another page
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#' || /^(mailto|tel):/.test(href) || a.hostname !== location.hostname) return;
    if (a.pathname === location.pathname && a.hash) return;
    e.preventDefault();
    setTimeout(function () { location.href = a.href; }, 120);
  });
})();
</script>
